backend:
  name: git-gateway
  branch: main

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: events
    label: Events
    files:
      - name: events_list
        label: Upcoming Events
        file: src/data/events.json
        fields:
          - name: events
            label: Events
            widget: list
            fields:
              - { name: id, label: ID, widget: string, hint: "Unique number e.g. 1, 2, 3" }
              - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
              - { name: venue, label: Venue, widget: string, hint: "e.g. Crush @ XOYO" }
              - { name: city, label: City, widget: string, default: London }
              - { name: country, label: Country, widget: string, default: UK }
              - name: status
                label: Status
                widget: select
                options:
                  - { label: "Tickets Available", value: tickets }
                  - { label: "Sold Out", value: sold_out }
                  - { label: "Announced", value: announced }
                  - { label: "Free Entry", value: free }
                  - { label: "Guestlist Only", value: guestlist }
              - { name: ticketUrl, label: Ticket URL, widget: string, required: false, hint: "Link to buy tickets (optional)" }

  - name: about
    label: Bio & About
    files:
      - name: about
        label: Bio & About
        file: src/data/about.json
        fields:
          - { name: photo, label: Profile Photo, widget: image }
          - { name: bio, label: Bio Text, widget: text, hint: "Use a blank line between paragraphs" }
          - name: credentials
            label: Credential Badges
            widget: list

  - name: gallery
    label: Gallery
    files:
      - name: gallery
        label: Photos
        file: src/data/gallery.json
        fields:
          - name: images
            label: Images
            widget: list
            fields:
              - { name: src, label: Photo, widget: image }
              - { name: alt, label: Description, widget: string, required: false }

  - name: music
    label: Music & Mixes
    files:
      - name: music
        label: Music & Mixes
        file: src/data/music.json
        fields:
          - name: mixcloudMixes
            label: Mixcloud Mixes
            widget: list
            fields:
              - { name: id, label: ID, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: embedUrl, label: Mixcloud Profile Path, widget: string, hint: "e.g. /misterbounceuk/" }
              - { name: externalUrl, label: Mixcloud Profile URL, widget: string }
          - name: soundcloudTracks
            label: SoundCloud Tracks
            widget: list
            fields:
              - { name: id, label: ID, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: embedUrl, label: SoundCloud Track URL, widget: string }
              - { name: externalUrl, label: SoundCloud Profile URL, widget: string }
          - name: externalPlayers
            label: External Show Links
            widget: list
            fields:
              - { name: id, label: ID, widget: string }
              - { name: title, label: Show Name, widget: string }
              - { name: url, label: Link URL, widget: string }
              - { name: description, label: Description, widget: string, required: false }
