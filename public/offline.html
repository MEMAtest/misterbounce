<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Mister Bounce</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
      font-family: system-ui, -apple-system, sans-serif;
      color: white;
      text-align: center;
      padding: 2rem;
    }
    .container {
      max-width: 400px;
    }
    h1 {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    button {
      padding: 1rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      background: #8b5cf6;
      color: white;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #7c3aed;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>MISTER BOUNCE</h1>
    <p>You're currently offline. Check your connection and try again to get back to the groove.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
